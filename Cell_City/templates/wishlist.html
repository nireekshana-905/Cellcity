<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Wishlist</title>
</head>
<body>
  {% include 'back_button.html' %}
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-black">
          <div class="container-fluid">
            <img src="https://www.cellcitysarnia.com/image/cache/catalog/logo-269x203.png" alt="">
            
            <form class="d-flex" role="search" method="GET" action="{% url 'search_results' %}">
              <input class="form-control me-2" type="text" name="query" placeholder="Search...">
              <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item" id="cart">
                  <a class="nav-link" aria-current="page" href="{% url 'cart' %}">Cart<i class="fa-solid fa-cart-shopping"></i></a>
                </li>
                <li class="nav-item">
                  <a class="nav-link " href="{% url 'wishlist'%}">Wishlist<i class="fa-solid fa-heart"></i></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home'%}">Home<i class="fa-solid fa-house"></i></a>
                  </li>
              </ul>        
            </div>
          </div>
        </nav>
    </header>
    <h1 class="text">Your Wishlist Items</h1>
    <div class="wishlist-container">
        
        {% if wishlist %}
            {% for product in wishlist.products.all %}
                <div class="product-card">

    <a href="{% url 'product_detail' product.id %}">
        <img src="{{ product.image_url }}" class="product-image">
    </a>

    <div class="product-info">

        <h5>{{ product.name }}</h5>

        <h3 class="price">
            ₹{{ product.price }}
        </h3>

        <p class="recommended">
            AI Recommended ⭐
        </p>

        <form action="{% url 'add_to_cart' product.id %}" method="POST">
            {% csrf_token %}
            <button class="view-btn">
                Add to Cart
            </button>
        </form>

        <a href="{% url 'remove_from_wishlist' product.id %}" class="remove-btn">
            Remove
        </a>

    </div>

</div>
            {% endfor %}
        {% else %}
            <p>Your wishlist is empty.</p>
        {% endif %}
    </div>
</main>  
     
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>

</body>
</html>




<style>
    body{
    background:#111;
}

.text{
    color:white;
    text-align:center;
    font-size:45px;
    margin:30px;
}

.wishlist-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
    padding:30px;
}

.product-card{
    width:260px;
    margin:auto;
    background:#1f1f1f;
    border-radius:18px;
    overflow:hidden;
    transition:.3s;
    box-shadow:0 0 15px rgba(0,140,255,.35);
}

.product-card:hover{
    transform:translateY(-8px);
    box-shadow:0 0 25px rgba(0,140,255,.6);
}


.product-image{
    width:100%;
    height:190px;
    object-fit:contain;
    background:white;
}

.product-info{
    padding:15px;
    text-align:center;
}

.product-info h5{
    color:white;
    font-size:18px;
    font-weight:600;
    line-height:1.4;
    height:75px;
    overflow:hidden;
}

.price{
    color:#00ff99;
    font-size:22px;
    font-weight:bold;
    margin:10px 0;
}

.recommended{
    color:#999;
    font-size:14px;
    margin-bottom:15px;
}

.view-btn{
    width:90%;
    padding:10px;
    border:none;
    border-radius:25px;
    background:linear-gradient(90deg,#00b4ff,#6d3cff);
    color:white;
    font-size:16px;
    font-weight:600;
}

.view-btn:hover{

    opacity:.9;

}

.remove-btn{
    display:block;
    width:90%;
    margin:12px auto;
    padding:10px;
    border-radius:25px;
    background:#ff3b3b;
    color:white;
    text-decoration:none;
    font-size:16px;
    font-weight:600;
}

.remove-btn:hover{
    color:white;
    text-decoration:none;
}

</style>
